<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Thermocouple Dashboard</title>
		<link rel="stylesheet" href="/styles.css">
		<style>
			@font-face {
				font-family: 'Fustat';
				src: url('/fonts/fustat-latin.woff2') format('woff2');
				font-weight: 200 800;
				font-display: swap;
			}

			@font-face {
				font-family: 'Plus Jakarta Sans';
				src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
				font-weight: 200 800;
				font-display: swap;
			}

			:root {
				color-scheme: dark;
				--bg: #0B0B0B;
				--surface: #161616;
				--rule: #2E2E2E;
				--ink: #FFFFFF;
				--ink-2: #A3A3A3;
				--accent: #D3AB50;
			}

			* {
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
				-webkit-text-size-adjust: 100%;
				-webkit-tap-highlight-color: transparent;
			}

			html,
			body {
				background: var(--bg);
				color: var(--ink);
			}

			body {
				font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
				font-size: 16px;
				line-height: 1.5;
			}

			.title {
				font-family: 'Fustat', system-ui, sans-serif;
				font-size: 28px;
				font-weight: 600;
				line-height: 1.3;
			}

			.heading {
				font-family: 'Fustat', system-ui, sans-serif;
				font-size: 20px;
				font-weight: 600;
			}

			.ink-2 {
				color: var(--ink-2);
			}

			.masthead {
				border-bottom: 1px solid var(--accent);
			}

			.card {
				background: var(--surface);
				border: 1px solid var(--rule);
				border-radius: 12px;
			}

			.reading {
				font-size: 44px;
				font-weight: 600;
				line-height: 1.1;
				font-variant-numeric: tabular-nums;
			}

			.unit {
				font-size: 20px;
				font-weight: 400;
				color: var(--ink-2);
			}

			.status-dot {
				background: var(--accent);
			}

			.status-dot.error {
				background: #E5534B;
			}

			.loading-pulse {
				animation: pulse 1.5s infinite ease-in-out;
			}

			@keyframes pulse {
				50% {
					opacity: 0.4;
				}
			}

			.truncate-1 {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
		</style>
	</head>

	<body class="min-h-screen select-none">
		<header class="masthead flex items-baseline justify-between gap-4 px-5 pt-3 pb-2">
			<h1 class="title">Live temperatures</h1>
			<div class="flex items-center gap-2 ink-2">
				<span id="status-dot" class="status-dot loading-pulse inline-block w-2 h-2 rounded-full"></span>
				<span id="status-text">Loading</span>
				<span id="datalogger-summary" class="hidden sm:inline">· <span id="datalogger-count"></span> · <span id="channel-count"></span> · <span id="connected-count"></span></span>
			</div>
		</header>

		<main class="px-5 py-4">
			<div id="thermocouple-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
				<!-- Thermocouple cards will be injected here by JavaScript -->
			</div>

			<div id="error-message" class="card mt-6 p-4 hidden">
				<h2 class="heading">Connection error</h2>
				<p class="mt-1"><span id="error-text"></span></p>
				<p class="ink-2 mt-1">Could not fetch thermocouple data. Check the server and try again.</p>
			</div>
		</main>

		<script>
			const grid = document.getElementById('thermocouple-grid');
			const errorMessageDiv = document.getElementById('error-message');
			const errorTextSpan = document.getElementById('error-text');
			const dataloggerCount = document.getElementById('datalogger-count');
			const channelCount = document.getElementById('channel-count');
			const connectedCount = document.getElementById('connected-count');

			function createThermocoupleCard(reading) {
				const card = document.createElement('div');
				card.className = 'card px-4 py-3 min-w-0';
				card.setAttribute('data-channel-id', reading.id);

				card.innerHTML = `
					<div class="channel-name truncate-1"></div>
					<div class="channel-info ink-2 truncate-1"></div>
					<div class="mt-2"><span class="temperature-display reading"></span><span class="temperature-unit unit"></span></div>
				`;

				updateThermocoupleCard(card, reading);
				return card;
			}

			function updateThermocoupleCard(card, reading) {
				const hasReading = reading.connected && typeof reading.temperature === 'number';
				const logger = reading.datalogger;

				card.querySelector('.channel-name').textContent = reading.name || `Channel ${reading.channel}`;
				card.querySelector('.channel-info').textContent =
					[logger, `Ch ${reading.channel}`, reading.type && `Type ${reading.type}`].filter(Boolean).join(' · ');
				card.querySelector('.temperature-display').textContent = hasReading ? reading.temperature.toFixed(1) : 'No reading';
				card.querySelector('.temperature-unit').textContent = hasReading ? ' °C' : '';
			}

			function placeholderHtml(title, text) {
				return `
					<div class="card col-span-full text-center py-8 px-4">
						<h2 class="heading mb-2">${title}</h2>
						<p class="ink-2">${text}</p>
					</div>
				`;
			}

			const statusDot = document.getElementById('status-dot');
			const statusText = document.getElementById('status-text');

			function updateStatusIndicator(message, type = 'loading') {
				statusDot.classList.toggle('loading-pulse', type === 'loading');
				statusDot.classList.toggle('error', type === 'error');
				statusText.textContent = message;
			}

			async function fetchTemperatures() {
				updateStatusIndicator(statusText.textContent, 'loading');
				errorMessageDiv.classList.add('hidden');

				try {
					const response = await fetch('/api/readings');
					if (!response.ok) {
						const errorData = await response.text();
						throw new Error(`HTTP error ${response.status}: ${errorData || response.statusText}`);
					}
					const data = await response.json();

					if (data.readings && data.readings.length > 0) {
						// Get existing cards by channel ID
						const existingCards = new Map();
						grid.querySelectorAll('[data-channel-id]').forEach(card => {
							const channelId = parseInt(card.getAttribute('data-channel-id'));
							existingCards.set(channelId, card);
						});

						// Remove any placeholder message
						const placeholder = grid.querySelector('.col-span-full');
						if (placeholder) {
							placeholder.remove();
						}

						// Track which channels we've processed
						const processedChannels = new Set();

						// Filter to only show truly connected channels (non-zero temperature)
						const connectedReadings = data.readings.filter(r => r.connected && r.temperature !== 0);

						if (connectedReadings.length === 0) {
							// Show placeholder if no connected readings
							grid.innerHTML = placeholderHtml('No probes connected', 'No probe has an active reading. Check that the probes are attached.');
						} else {
							// Update or create cards for each connected reading
							connectedReadings.forEach((reading, index) => {
							processedChannels.add(reading.id);

							if (existingCards.has(reading.id)) {
								// Update existing card
								const existingCard = existingCards.get(reading.id);
								updateThermocoupleCard(existingCard, reading);
							} else {
								// Create new card with staggered animation
								setTimeout(() => {
									const card = createThermocoupleCard(reading);
									grid.appendChild(card);
								}, index * 50);
							}
													});

							// Remove cards for channels that are no longer connected
							existingCards.forEach((card, channelId) => {
								if (!processedChannels.has(channelId)) {
									card.remove();
								}
							});
						}
					} else {
						// No data available at all
						grid.innerHTML = placeholderHtml('No data', 'No readings received. Check the datalogger connection and configuration.');
					}
					
					// Update summary information
					const trueConnectedReadings = data.readings.filter(r => r.connected && r.temperature !== 0);
					dataloggerCount.textContent = `${data.totalDataloggers} datalogger${data.totalDataloggers !== 1 ? 's' : ''}`;
					channelCount.textContent = `${data.totalActive} channel${data.totalActive !== 1 ? 's' : ''}`;
					connectedCount.textContent = `${trueConnectedReadings.length} connected`;
					
					updateStatusIndicator(`Updated ${new Date().toLocaleTimeString()}`, 'success');
				} catch (error) {
					console.error("Failed to fetch temperatures:", error);
					grid.innerHTML = placeholderHtml('Connection error', 'Failed to load data.');
					errorTextSpan.textContent = error.message;
					errorMessageDiv.classList.remove('hidden');
					updateStatusIndicator('Error fetching data', 'error');
				}
			}

			fetchTemperatures();
			setInterval(fetchTemperatures, 5000);
		</script>
	</body>

</html>
